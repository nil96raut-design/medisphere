version: "3.8"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthtrack
      POSTGRES_USER: healthtrack
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - healthtrack-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U healthtrack" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healthtrack-db-data:
