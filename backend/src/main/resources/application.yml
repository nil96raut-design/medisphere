server:
  port: ${PORT:8085}

spring:
  application:
    name: healthtrack-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthtrack}
    username: ${SPRING_DATASOURCE_USERNAME:healthtrack}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  jwt:
    secret: "REPLACE_THIS_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_256_BITS_LONG_FOR_HS256"
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  cors:
    allowed-origins: "http://localhost:5173"
