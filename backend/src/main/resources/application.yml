server:
  port: ${PORT:8085}

spring:
  application:
    name: healthtrack-backend

  # Postgres + Flyway is now the default. Schema is defined entirely by the
  # migrations in db/migration — ddl-auto is validate-only, so Hibernate will
  # fail fast if an entity drifts from the migrated schema instead of quietly
  # altering tables underneath you.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthtrack}
    username: ${DB_USER:healthtrack}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: "REPLACE_THIS_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_256_BITS_LONG_FOR_HS256"
    expiration-ms: 86400000 # 24h

  cors:
    allowed-origins: "http://localhost:5173"
