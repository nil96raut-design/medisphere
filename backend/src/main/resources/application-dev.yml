server:
  port: 8085

spring:
  datasource:
    url: jdbc:h2:mem:healthtrack;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
      jakarta:
        persistence:
          lock:
            timeout: 5000

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: "dev-secret-key-that-is-at-least-32-characters-long-for-hs256"
    expiration-ms: 86400000

  cors:
    allowed-origins: "http://localhost:5173"
